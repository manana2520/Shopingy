[project]
name = "shopingy-dashboard"
version = "0.1.0"
description = "Shopingy retail intelligence dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
